{% load web_tags %}{# Low stock popup — web app খোলার সময় (প্রতি browser session এ একবার) + dashboard banner এর "View" বোতাম #}
<div class="modal-wrap" x-data x-show="$store.lowStock.open" x-cloak x-transition.opacity.duration.120ms
     @click.self="$store.lowStock.close()" @keydown.escape.window="$store.lowStock.close()"
     x-effect="if ($store.lowStock.open) $nextTick(() => $refs.lsOk && $refs.lsOk.focus())"
     role="dialog" aria-modal="true" aria-labelledby="ls-title">
  <div class="modal ls-modal">
    <div class="modal-icon ls-icon" :class="{ 'is-out': $store.lowStock.out > 0 }">{% icon "alert" 22 %}</div>
    <h2 id="ls-title">Stock needs attention</h2>
    <p class="ls-sub" x-text="$store.lowStock.headline + ' — time to restock.'"></p>
    <ul class="ls-list">
      <template x-for="p in $store.lowStock.shown" :key="p.product_id">
        <li>
          <span class="ls-name" x-text="p.product_name"></span>
          <span class="stock-pill" :class="Number(p.total_stock_quantity) <= 0 ? 'is-out' : 'is-low'"
                x-text="Number(p.total_stock_quantity) <= 0 ? 'Out of stock' : p.total_stock_quantity + ' left (alert at ' + p.alert_quantity + ')'"></span>
        </li>
      </template>
    </ul>
    <p class="ls-more" x-show="$store.lowStock.more > 0" x-text="'+ ' + $store.lowStock.more + ' more'"></p>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" x-ref="lsOk" @click="$store.lowStock.close()">Dismiss</button>
      <a class="btn btn-primary" :href="$store.lowStock.listUrl">View products</a>
    </div>
  </div>
</div>
